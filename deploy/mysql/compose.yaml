name: pollinsight-latest-test

services:
  mysql:
    image: mysql:8.4
    container_name: pollinsight-latest-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:?DB_NAME must be set in the server environment file}
      MYSQL_USER: ${DB_USER:?DB_USER must be set in the server environment file}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in the server environment file}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set in the server environment file}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - pollinsight-latest
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  app:
    image: ${APP_IMAGE:?APP_IMAGE must identify a validated application image}
    container_name: pollinsight-latest-app
    restart: unless-stopped
    env_file:
      - ${POLLINSIGHT_ENV_FILE:?POLLINSIGHT_ENV_FILE must point to the server environment file}
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: mysql
      SEED_DEMO_ACCOUNT: "false"
    ports:
      - "127.0.0.1:${APP_PORT:-3100}:3000"
    volumes:
      - app-data:/app/data
      - app-uploads:/app/public/uploads
    networks:
      - pollinsight-latest
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

volumes:
  mysql-data:
    name: pollinsight-latest-mysql-data
  app-data:
    name: pollinsight-latest-app-data
  app-uploads:
    name: pollinsight-latest-app-uploads

networks:
  pollinsight-latest:
    name: pollinsight-latest-network

