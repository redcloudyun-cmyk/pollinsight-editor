<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>POLLINSIGHT | 신청 관리</title><style>body{margin:0;background:#f5f7fb;color:#172033;font-family:Pretendard,system-ui,sans-serif}.top{height:64px;background:#fff;border-bottom:1px solid #dbe3ee;display:flex;align-items:center;gap:13px;padding:0 30px}.mark{background:#2563eb;color:white;border-radius:9px;padding:8px 10px;font-weight:900}.spacer{flex:1}a{text-decoration:none;color:#526075;font-size:14px}.shell{max-width:960px;margin:auto;padding:36px 22px}h1{margin:0}p{color:#64748b}.table{margin-top:22px;background:#fff;border:1px solid #dbe3ee;border-radius:14px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:680px}th,td{padding:14px;text-align:left;border-bottom:1px solid #edf1f6;font-size:14px;vertical-align:top}th{background:#f8fafc;color:#475569;font-size:12px}.empty{padding:50px;text-align:center;color:#64748b}.tag{font-size:11px;padding:4px 7px;border-radius:99px;background:#e8f0ff;color:#2459ba}@media(max-width:640px){.top{padding:0 15px}.shell{padding:25px 14px}}</style></head><body><header class="top"><span class="mark">PI</span><strong>임명장 신청 관리</strong><span class="spacer"></span><a id="back" href="/profiles.html">명함으로 돌아가기</a></header><main class="shell"><h1>신청 현황</h1><p id="caption">신청 내역을 불러오는 중입니다.</p><section class="table"><table><thead><tr><th>신청자</th><th>연락처</th><th>메시지</th><th>상태</th><th>신청일</th></tr></thead><tbody id="list"></tbody></table></section></main><script>const $=id=>document.getElementById(id),esc=v=>String(v||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));async function load(){try{const id=new URLSearchParams(location.search).get('id');if(!id)throw Error('명함을 먼저 선택해 주세요.');$('back').href='/profile-studio.html?id='+encodeURIComponent(id);const r=await fetch('/api/profiles/'+id+'/applications',{credentials:'include'}),d=await r.json();if(!r.ok)throw Error(d.message||'신청 내역을 불러오지 못했습니다.');$('caption').textContent=`총 ${d.applications.length}건의 신청이 있습니다.`;$('list').innerHTML=d.applications.length?d.applications.map(x=>`<tr><td><strong>${esc(x.applicant_name)}</strong></td><td>${esc(x.phone||'')}<br>${esc(x.email||'')}</td><td>${esc(x.message||'-')}</td><td><span class="tag">${esc(x.status)}</span></td><td>${new Date(x.created_at).toLocaleString('ko-KR')}</td></tr>`).join(''):'<tr><td class="empty" colspan="5">아직 신청 내역이 없습니다.</td></tr>'}catch(e){$('caption').textContent=e.message}}load()</script></body></html>
