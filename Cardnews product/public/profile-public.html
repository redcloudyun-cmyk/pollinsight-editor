<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>프로필</title><link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" rel="stylesheet"><style>body{margin:0;background:#101116;color:#fff;font-family:Pretendard,system-ui,sans-serif}.page{max-width:520px;min-height:100vh;margin:auto;padding:36px 24px;background:linear-gradient(150deg,#191923,#101116)}.page.portfolio{background:linear-gradient(150deg,#172c4d,#101116)}.page.campaign{background:linear-gradient(150deg,#183876,#101116)}.brand{font-weight:900;font-size:14px;letter-spacing:.08em;opacity:.75}.photo{width:140px;height:140px;margin:44px auto 19px;border-radius:50%;background:#64748b center/cover;border:4px solid #ffffff55}.name{text-align:center;font-size:32px;margin:0}.role{text-align:center;color:#a9c8ff}.bio{text-align:center;line-height:1.7;color:#e3e8f2;margin:22px 0}.contacts,.links{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin:24px 0}.button{display:block;padding:14px 9px;text-align:center;border-radius:13px;border:1px solid #ffffff2a;background:#ffffff12;color:#fff;text-decoration:none;font-weight:800}.cta{background:#2563eb;border:0;margin:10px 0 25px}.box{border-top:1px solid #ffffff24}.section{padding:17px 0;border-bottom:1px solid #ffffff20}.section strong{display:block;font-size:17px}.item{display:block;margin-top:10px;color:#d6e3ff;text-decoration:none}.empty{padding:100px 20px;text-align:center;color:#b9c3d5}</style></head><body><main id="app" class="page"><p class="empty">페이지를 불러오는 중입니다.</p></main><script>const esc=v=>String(v||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const valid=u=>{try{const x=new URL(u);return ['http:','https:','mailto:','tel:'].includes(x.protocol)?x.href:''}catch{return ''}};async function run(){const slug=location.pathname.split('/').pop();const r=await fetch('/api/public-profiles/'+encodeURIComponent(slug));const d=await r.json();if(!r.ok)throw Error();const p=d.profile,x=p.profile_data||{},link=(label,url,cls='')=>{const safe=valid(url);return safe?`<a class="button ${cls}" data-track href="${safe}" data-target="${esc(url)}">${esc(label)}</a>`:''};document.title=(x.name||p.title)+' | 프로필';const contacts=[link('전화',x.phone?'tel:'+x.phone:''),link('이메일',x.email?'mailto:'+x.email:'')].filter(Boolean).join('');const links=(x.links||[]).map(v=>link(v.label||'링크',v.url)).filter(Boolean).join('');const list=(items)=>items?.length?items.map(v=>v.url?`<a class="item" data-track data-target="${esc(v.url)}" href="${valid(v.url)}">${esc(v.title)}</a>`:`<span class="item">${esc(v.title)}</span>`).join(''):'';$('app').className='page '+esc(p.template_key);$('app').innerHTML=`<div class="brand">POLLINSIGHT PROFILE</div><div class="photo" style="background-image:url('${esc(x.photo||'')}')"></div><h1 class="name">${esc(x.name||p.title)}</h1><p class="role">${esc(x.role)}</p><p class="bio">${esc(x.bio)}</p><div class="contacts">${contacts}</div>${link('프로젝트 문의하기',x.inquiryUrl||x.messageUrl,'cta')}<div class="links">${links}</div><div class="box">${list(x.portfolio)?`<section class="section"><strong>포트폴리오</strong>${list(x.portfolio)}</section>`:''}${list(x.resources)?`<section class="section"><strong>자료실</strong>${list(x.resources)}</section>`:''}</div>`;document.querySelectorAll('[data-track]').forEach(a=>a.onclick=()=>fetch('/api/public-profiles/'+encodeURIComponent(slug)+'/click',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({target:a.dataset.target||a.href})}));}function $(id){return document.getElementById(id)}run().catch(()=>{$('app').innerHTML='<p class="empty">공개 페이지를 찾을 수 없습니다.</p>'})</script></body></html>
