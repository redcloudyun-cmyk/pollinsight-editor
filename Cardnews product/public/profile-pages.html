<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>POLLINSIGHT | 명함 페이지 구성</title>
  <style>
    :root{--blue:#2563eb;--ink:#172033;--muted:#64748b;--line:#dbe3ee}*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:var(--ink);font-family:Pretendard,system-ui,sans-serif}.top{height:64px;display:flex;align-items:center;gap:13px;padding:0 30px;background:#fff;border-bottom:1px solid var(--line)}.mark{padding:8px 10px;border-radius:9px;background:var(--blue);color:#fff;font-weight:900}.spacer{flex:1}a{text-decoration:none;color:#526075;font-size:14px}.shell{max-width:1160px;margin:auto;padding:32px 22px}.intro h1{margin:0;font-size:28px}.intro p{color:var(--muted)}.layout{display:grid;grid-template-columns:275px minmax(0,1fr);gap:22px;margin-top:22px}.panel{background:#fff;border:1px solid var(--line);border-radius:15px;padding:17px}.panel h2{font-size:16px;margin:0 0 12px}.limit{font-size:12px;color:var(--muted);margin:-5px 0 12px}.page-list{display:grid;gap:7px}.page-item{width:100%;padding:11px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:9px;cursor:pointer}.page-item.active{border-color:var(--blue);background:#eef5ff;color:#174ea6;font-weight:800}.type-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.type{min-height:74px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;font:inherit;font-size:12px}.type strong{display:block;font-size:19px}.field{margin:13px 0}.field label{display:block;margin-bottom:5px;font-size:12px;font-weight:800;color:#475569}.field input,.field textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;font:inherit}.field textarea{min-height:128px;resize:vertical}.drop-zone{border:2px dashed #b9cbe5;border-radius:10px;padding:13px;text-align:center;color:#526075;font-size:12px;background:#f8fbff;cursor:pointer}.drop-zone.over{border-color:var(--blue);background:#eaf3ff;color:#174ea6}.drop-zone input{display:none}.button-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}button{border:0;border-radius:9px;padding:10px 12px;background:var(--blue);color:#fff;font-weight:800;cursor:pointer}button.secondary{background:#e8edf5;color:#334155}button.danger{background:#fff0f1;color:#be123c;border:1px solid #fecdd3}.hint{font-size:12px;color:var(--muted);line-height:1.55;background:#f8fafc;border-radius:9px;padding:10px}.empty{padding:35px 10px;color:var(--muted);text-align:center}.toast{min-height:20px;color:#1d4ed8;font-size:13px;margin-top:10px}@media(max-width:760px){.top{padding:0 15px}.shell{padding:22px 14px}.layout{grid-template-columns:1fr}.top a{font-size:12px}.type-grid{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>
  <header class="top"><span class="mark">PI</span><strong>페이지 구성</strong><span class="spacer"></span><a id="back-editor" href="/profile-studio.html">기본 정보 편집</a><a href="/profiles.html">내 명함</a></header>
  <main class="shell"><section class="intro"><h1>모바일 명함 페이지 구성</h1><p>공약, 약도, 임명장 안내, 인사말과 자유 페이지를 필요한 순서로 구성하세요.</p></section><div class="layout"><aside class="panel"><h2>페이지 목록</h2><p class="limit" id="limit">불러오는 중입니다.</p><div class="page-list" id="page-list"></div></aside><section class="panel"><h2>새 페이지 템플릿</h2><div class="type-grid" id="templates"></div><p class="hint">페이지를 선택하면 오른쪽에서 제목·본문·버튼을 자유롭게 수정할 수 있습니다. 약도는 지도 공유 링크 또는 길찾기 링크를 버튼 주소에 넣어 연결하세요.</p><div id="editor" hidden><div class="field"><label>탭 제목</label><input id="title" maxlength="80"></div><div class="field"><label>페이지 제목</label><input id="heading" maxlength="140"></div><div class="field"><label>본문</label><textarea id="body" maxlength="3000"></textarea></div><div class="field"><label>대표 이미지</label><input id="image" placeholder="https://... 또는 아래에 파일을 끌어놓으세요"><label id="page-image-drop" class="drop-zone">이미지 파일을 여기에 끌어놓거나 클릭해 선택<input id="page-image-file" type="file" accept="image/*"></label></div><div class="field"><label>유튜브 영상 주소 (영상 페이지에서 사용)</label><input id="video-url" placeholder="https://www.youtube.com/watch?v=..."><small>youtube.com, youtu.be, youtube.com/embed 주소를 사용할 수 있습니다.</small></div><div class="field"><label>버튼 이름</label><input id="button-label" maxlength="60" placeholder="자세히 보기"></div><div class="field"><label>버튼 연결 주소</label><input id="button-url" placeholder="https://... 또는 지도 공유 주소"></div><div class="button-row"><button id="save">페이지 구성 저장</button><button id="remove" class="danger">선택 페이지 삭제</button></div></div><p class="toast" id="message"></p></section></div></main>
  <script>
    const TYPES={intro:{icon:'◉',name:'기본 소개',title:'소개',heading:'반갑습니다',body:'나와 활동을 소개합니다.'},pledge:{icon:'✓',name:'공약',title:'핵심 공약',heading:'약속을 실천하겠습니다',body:'주요 공약과 실행 계획을 입력하세요.'},map:{icon:'⌖',name:'사무실 약도',title:'오시는 길',heading:'사무실 안내',body:'주소, 운영 시간, 주차 안내를 입력하세요.',buttonLabel:'지도에서 보기'},certificate:{icon:'▣',name:'임명장 발급',title:'임명장',heading:'함께할 분을 기다립니다',body:'임명장 발급 안내와 신청 방법을 입력하세요.',buttonLabel:'임명장 신청'},greeting:{icon:'✦',name:'인사말',title:'인사말',heading:'진심을 담아 인사드립니다',body:'후보자 또는 대표자의 인사말을 입력하세요.'},video:{icon:'▶',name:'유튜브 영상',title:'영상 보기',heading:'영상으로 전하는 이야기',body:'소개 영상을 시청해 주세요.'},custom:{icon:'＋',name:'자유 페이지',title:'새 페이지',heading:'새로운 이야기',body:'원하는 내용을 자유롭게 작성하세요.'}};
    const $=id=>document.getElementById(id);const state={profile:null,pages:[],selected:null,limit:1};const api=async(path,opt={})=>{const r=await fetch(path,{credentials:'include',headers:{'Content-Type':'application/json'},...opt});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||'요청을 처리하지 못했습니다.');return d};
    const makePage=type=>{const t=TYPES[type];return{id:'page-'+Date.now().toString(36),type,title:t.title,heading:t.heading,body:t.body,image:'',videoUrl:'',buttonLabel:t.buttonLabel||'',buttonUrl:''}};
    function render(){const selected=state.pages.find(p=>p.id===state.selected);$('limit').textContent=`${state.pages.length} / ${state.limit}장 사용 중`;$('page-list').innerHTML=state.pages.length?state.pages.map((p,i)=>`<button class="page-item ${p.id===state.selected?'active':''}" data-id="${p.id}">${i+1}. ${p.title||TYPES[p.type].name}<small style="display:block;margin-top:4px;color:#64748b;font-weight:400">${TYPES[p.type].name}</small></button>`).join(''):'<p class="empty">추가한 페이지가 없습니다.</p>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{state.selected=b.dataset.id;render()});$('editor').hidden=!selected;if(!selected)return;['title','heading','body','image','video-url','button-label','button-url'].forEach(id=>$(id).value=selected[{title:'title',heading:'heading',body:'body',image:'image','video-url':'videoUrl','button-label':'buttonLabel','button-url':'buttonUrl'}[id]]||'')}
    function readEditor(){const p=state.pages.find(x=>x.id===state.selected);if(!p)return;p.title=$('title').value;p.heading=$('heading').value;p.body=$('body').value;p.image=$('image').value;p.videoUrl=$('video-url').value;p.buttonLabel=$('button-label').value;p.buttonUrl=$('button-url').value}
    async function save(){try{readEditor();$('message').textContent='저장 중입니다…';const data={...(state.profile.profile_data||{}),pages:state.pages};await api('/api/profiles/'+state.profile.id,{method:'PATCH',body:JSON.stringify({title:state.profile.title,slug:state.profile.slug,template_key:state.profile.template_key,is_published:state.profile.is_published,profile_data:data})});state.profile.profile_data=data;$('message').textContent='페이지 구성을 저장했습니다. 공개 페이지에도 반영됩니다.';render()}catch(e){$('message').textContent=e.message}}
    const uploadFile=async file=>{if(!state.profile?.id)throw new Error('프로필 정보를 찾을 수 없습니다.');const formData=new FormData();formData.append('file',file);const response=await fetch('/api/profiles/'+state.profile.id+'/upload',{method:'POST',credentials:'include',body:formData});const data=await response.json();if(!response.ok)throw new Error(data.message||'업로드 실패');return data.url;};
    const setPageImage=async file=>{if(!state.profile?.id){$('message').textContent='프로필 정보를 찾을 수 없습니다.';return}if(!file?.type?.startsWith('image/')){$('message').textContent='이미지 파일만 올릴 수 있습니다.';return}if(file.size>8*1024*1024){$('message').textContent='이미지는 8MB 이하만 올릴 수 있습니다.';return}$('message').textContent='대표 이미지를 업로드하고 있습니다...';try{const uploadedUrl=await uploadFile(file);$('image').value=uploadedUrl;readEditor();$('message').textContent='대표 이미지를 성공적으로 업로드했습니다. 페이지 구성 저장을 눌러 최종 반영하세요.'}catch(error){$('message').textContent=error.message}};const pageDrop=$('page-image-drop');['dragenter','dragover'].forEach(type=>pageDrop.addEventListener(type,e=>{e.preventDefault();pageDrop.classList.add('over')}));['dragleave','drop'].forEach(type=>pageDrop.addEventListener(type,e=>{e.preventDefault();pageDrop.classList.remove('over')}));pageDrop.addEventListener('drop',e=>setPageImage(e.dataTransfer.files[0]));$('page-image-file').addEventListener('change',e=>setPageImage(e.target.files[0]));$('templates').innerHTML=Object.entries(TYPES).map(([key,t])=>`<button class="type" data-type="${key}"><strong>${t.icon}</strong>${t.name}</button>`).join('');document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{if(state.pages.length>=state.limit){$('message').textContent=`현재 플랜은 ${state.limit}장까지 사용할 수 있습니다.`;return}readEditor();const p=makePage(b.dataset.type);state.pages.push(p);state.selected=p.id;render()});$('save').onclick=save;$('remove').onclick=()=>{if(!state.selected)return;if(!confirm('선택한 페이지를 삭제할까요?'))return;state.pages=state.pages.filter(p=>p.id!==state.selected);state.selected=state.pages[0]?.id||null;render()};
    async function load(){try{const id=new URLSearchParams(location.search).get('id');if(!id)throw Error('명함을 먼저 선택해 주세요.');const [profile,list]=await Promise.all([api('/api/profiles/'+id),api('/api/profiles')]);state.profile=profile.profile;state.limit=list.pageLimit||1;state.pages=Array.isArray(state.profile.profile_data?.pages)?state.profile.profile_data.pages:[];if(!state.pages.length){const p=makePage('intro');state.pages=[p]}state.selected=state.pages[0].id;$('back-editor').href='/profile-studio.html?id='+encodeURIComponent(id);render()}catch(e){$('message').textContent=e.message}}
    load();
  </script>
<script>
/* Page order is content order on the public card.  Keep it explicit rather than
   forcing members to recreate a page just to move it. */
(()=>{const mount=()=>{const list=document.getElementById('page-list');if(!list||!window.MutationObserver)return;const decorate=()=>{list.querySelectorAll('.page-item:not([data-order-tools])').forEach(item=>{item.dataset.orderTools='1';const id=item.dataset.id;const tools=document.createElement('span');tools.style.cssText='display:inline-flex;gap:5px;margin:8px 0 0';tools.innerHTML='<button type="button" data-move="up" title="위로 이동" style="padding:4px 8px;font-size:12px">↑</button><button type="button" data-move="down" title="아래로 이동" style="padding:4px 8px;font-size:12px">↓</button>';tools.querySelectorAll('[data-move]').forEach(button=>button.addEventListener('click',event=>{event.preventDefault();event.stopPropagation();const index=state.pages.findIndex(page=>page.id===id);const next=button.dataset.move==='up'?index-1:index+1;if(index<0||next<0||next>=state.pages.length)return;[state.pages[index],state.pages[next]]=[state.pages[next],state.pages[index]];state.selected=id;render();document.getElementById('message').textContent='페이지 순서를 바꿨습니다. 저장을 눌러 공개 명함에 반영하세요.'}));item.append(tools)})};new MutationObserver(decorate).observe(list,{childList:true,subtree:false});decorate()};setTimeout(mount,120)})();
</script>
</body>
</html>
