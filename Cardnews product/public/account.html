<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>POLLINSIGHT | 마이페이지</title><link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" rel="stylesheet"><style>
body{margin:0;background:#0b1220;color:#e5edf9;font-family:Pretendard,system-ui,sans-serif}.top{height:64px;display:flex;align-items:center;gap:12px;padding:0 32px;border-bottom:1px solid #293956;background:#101a2c}.mark{font-weight:900;color:#fff;background:#2563eb;padding:8px;border-radius:8px}.spacer{flex:1}a{color:#b6d1ff;text-decoration:none;font-size:14px}main{max-width:1120px;margin:38px auto;padding:0 24px}h1{margin:0;font-size:28px}p{color:#9eb0ca}.hero{display:flex;justify-content:space-between;gap:20px;align-items:flex-end}.credit{background:#173a70;border:1px solid #3b82f6;border-radius:14px;padding:16px 20px;min-width:220px}.credit b{display:block;font-size:26px;color:#fff;margin-top:5px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:22px 0}.card,.panel{background:#111d31;border:1px solid #2b3e5a;border-radius:13px}.card{padding:17px}.card span{font-size:12px;color:#91a7c8}.card strong{display:block;font-size:25px;margin-top:8px}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}.panel{padding:18px}.panel h2{font-size:15px;margin:0 0 13px}.row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid #263951;font-size:13px}.row:last-child{border-bottom:0}.muted{color:#91a7c8;font-size:12px}.plus{color:#67e8a5}.minus{color:#fda4af}.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}.plan{border:1px solid #2c405e;border-radius:12px;padding:15px}.plan.featured{border-color:#3b82f6}.pill{font-size:11px;padding:4px 7px;border-radius:999px;background:#1e3a5f;color:#b9d6ff}button{width:100%;margin-top:13px;border:0;border-radius:8px;padding:10px;background:#2563eb;color:#fff;font-weight:800;cursor:pointer}button:disabled{background:#334155;cursor:not-allowed}#message{min-height:18px;color:#facc15}@media(max-width:760px){.top{padding:0 15px}.hero{display:block}.credit{margin-top:16px}.cards,.plans,.grid{grid-template-columns:1fr 1fr}.grid{display:block}.panel{margin-top:14px}}@media(max-width:450px){.cards,.plans{grid-template-columns:1fr}}
</style></head><body><header class="top"><span class="mark">PI</span><strong>마이페이지</strong><span class="spacer"></span><a href="/workspace.html">내 작업</a><a href="/index.html">편집기</a></header><main>
<section class="hero"><div><h1 id="welcome">내 현황</h1><p id="current">계정 정보를 불러오는 중입니다.</p></div><div class="credit"><span class="muted">사용 가능 크레딧</span><b id="credit-balance">–</b><span id="credit-caption" class="muted">이번 달 지급 기준</span></div></section>
<section class="cards"><article class="card"><span>이번 달 편집 시간</span><strong id="editor-minutes">–</strong></article><article class="card"><span>이번 달 AI 요청</span><strong id="ai-requests">–</strong></article><article class="card"><span>저장 프로젝트</span><strong id="project-count">–</strong></article><article class="card"><span>이번 달 사용 크레딧</span><strong id="credit-spent">–</strong></article></section>
<section class="grid"><article class="panel"><h2>최근 작업</h2><div id="recent-projects" class="muted">불러오는 중입니다.</div></article><article class="panel"><h2>크레딧 내역</h2><div id="ledger" class="muted">불러오는 중입니다.</div></article></section>
<section class="panel" style="margin-top:16px"><h2>플랜과 크레딧</h2><p>월간 지급 크레딧은 매월 갱신됩니다. 별도 구매 크레딧 결제는 준비 중이며, 사용 내역은 위 원장에 표시됩니다.</p><div class="plans"><article class="plan"><span class="pill">FREE</span><h3>무료</h3><p>월 100 크레딧</p><button disabled>기본 플랜</button></article><article class="plan"><span class="pill">BASIC</span><h3>베이직</h3><p>월 600 크레딧</p><button data-tier="basic">변경 요청</button></article><article class="plan featured"><span class="pill">PREMIUM</span><h3>프리미엄</h3><p>월 2,500 크레딧</p><button data-tier="premium">변경 요청</button></article></div><p id="message"></p></section>
</main><script>
const names={free:'무료',basic:'베이직',premium:'프리미엄'};const api=(path,opts={})=>fetch(path,{credentials:'include',headers:{'Content-Type':'application/json',...(opts.headers||{})},...opts}).then(async r=>{const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.message||'요청을 처리하지 못했습니다.');return d});const date=v=>new Date(v).toLocaleDateString('ko-KR');
async function load(){try{const me=await api('/api/auth/me');const user=me.user;const data=await api('/api/account/summary');const s=data.summary;document.querySelector('#welcome').textContent=`${user.displayName}님의 현황`;document.querySelector('#current').textContent=`현재 ${names[user.tier]||user.tier} 플랜을 사용 중입니다.`;document.querySelector('#credit-balance').textContent=`${s.creditBalance.toLocaleString()} C`;document.querySelector('#credit-caption').textContent=`이번 달 지급 ${s.creditGranted.toLocaleString()} C · 사용 ${s.creditSpent.toLocaleString()} C`;document.querySelector('#editor-minutes').textContent=`${s.editorMinutes}분`;document.querySelector('#ai-requests').textContent=`${s.aiRequests}회`;document.querySelector('#project-count').textContent=`${s.projectCount}개`;document.querySelector('#credit-spent').textContent=`${s.creditSpent} C`;document.querySelector('#recent-projects').innerHTML=s.recentProjects.length?s.recentProjects.map(p=>`<div class="row"><a href="/index.html?project=${p.id}">${p.title}</a><span class="muted">${date(p.updated_at)}</span></div>`).join(''):'아직 저장한 작업이 없습니다.';document.querySelector('#ledger').innerHTML=s.ledger.length?s.ledger.map(x=>`<div class="row"><span>${x.description||x.event_type}<br><small class="muted">${date(x.created_at)}</small></span><b class="${x.amount>=0?'plus':'minus'}">${x.amount>=0?'+':''}${x.amount} C</b></div>`).join(''):'아직 크레딧 내역이 없습니다.';document.querySelectorAll('[data-tier]').forEach(b=>{if(b.dataset.tier===user.tier)b.disabled=true;b.onclick=async()=>{try{const r=await api('/api/billing/upgrade-requests',{method:'POST',body:JSON.stringify({tier:b.dataset.tier})});document.querySelector('#message').textContent=r.message;load()}catch(e){document.querySelector('#message').textContent=e.message}})}catch(e){location.replace('/login.html')}}load();
</script></body></html>
