<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>POLLINSIGHT | 디지털 명함 관리</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#172033;font-family:Pretendard,system-ui,sans-serif}.top{height:70px;background:#fff;border-bottom:1px solid #e3e8f0;display:flex;align-items:center;gap:14px;padding:0 32px}.mark{display:grid;place-items:center;width:40px;height:40px;border-radius:10px;background:#2864e8;color:#fff;font-weight:900}.spacer{flex:1}a{text-decoration:none;color:#526075;font-size:14px}.primary{padding:11px 15px;border-radius:10px;background:#2864e8;color:#fff;font-weight:800}
    main{max-width:1230px;margin:46px auto;padding:0 24px}.heading{display:flex;justify-content:space-between;align-items:end;gap:18px}.heading h1{margin:0;font-size:34px;letter-spacing:-.06em}.heading p{margin:12px 0 0;color:#728096}.count{padding:8px 11px;border-radius:999px;background:#e9effa;color:#35619c;font-size:12px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;margin-top:32px}.card{overflow:hidden;border:1px solid #dce3ed;border-radius:20px;background:#fff;box-shadow:0 7px 22px #1a31500b;transition:.2s}.card:hover{transform:translateY(-4px);box-shadow:0 16px 34px #1a315018}
    .visual{position:relative;height:230px;padding:21px;color:#fff;background:#15253f;overflow:hidden}.visual:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#07152b05 20%,#07152bd9 100%)}.visual img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.visual-content{position:absolute;z-index:2;left:20px;right:20px;bottom:20px}.visual small{display:inline-flex;padding:6px 8px;border:1px solid #ffffff5c;border-radius:999px;background:#ffffff14;font-size:10px;font-weight:800}.visual h2{margin:12px 0 0;font-size:25px;line-height:1.17;letter-spacing:-.06em}.visual p{margin:7px 0 0;font-size:12px;opacity:.8}
    .theme-official{background:linear-gradient(145deg,#345985,#132a50)}.theme-sample-community{background:linear-gradient(145deg,#3c9b76,#0d372f)}.theme-sample-policy{background:linear-gradient(145deg,#3374d8,#0e2752)}.theme-sample-creator{background:linear-gradient(145deg,#d1579c,#29123f)}.theme-sample-consultant{background:linear-gradient(145deg,#497b70,#101a20)}.theme-sample-portfolio{background:linear-gradient(145deg,#cb9570,#3d2a21)}.theme-sample-trainer{background:linear-gradient(145deg,#ef5a45,#4c1718)}.theme-sample-content-director{background:linear-gradient(145deg,#f59a3e,#58250f)}
    .theme-sample-community,.theme-sample-consultant{border-radius:0}.theme-sample-portfolio .visual-content{font-family:Georgia,"Noto Serif KR",serif}.theme-sample-trainer h2{font-style:italic}.theme-sample-content-director .visual-content{background:#ffffff18;padding:13px;border-radius:18px;backdrop-filter:blur(8px)}
    .meta{padding:17px}.meta>strong{display:block;font-size:14px}.stats{display:flex;gap:12px;margin:10px 0 15px;color:#758093;font-size:11px}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions a,.actions button{border:1px solid #dbe3ee;background:#fff;border-radius:9px;padding:8px 10px;color:#334155;font:inherit;font-size:11px;cursor:pointer}.actions .main{border-color:#2864e8;background:#2864e8;color:#fff;font-weight:800}.empty{border:1px dashed #b8c8de;border-radius:18px;padding:45px;text-align:center;color:#64748b}
    @media(max-width:980px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.top{height:62px;padding:0 14px}.top>span:nth-of-type(2){display:none}main{margin:28px auto;padding:0 14px}.heading h1{font-size:28px}.grid{grid-template-columns:1fr;gap:16px}.visual{height:280px}}
  </style>
</head>
<body>
  <header class="top"><span class="mark">PI</span><strong>POLLINSIGHT</strong><span>디지털 명함</span><span class="spacer"></span><a href="/workspace.html">내 작업</a><a class="primary" href="/profile-studio.html">새로 만들기</a></header>
  <main>
    <section class="heading"><div><h1>내 디지털 명함</h1><p>완성 샘플을 살펴보고 내 정보로 바꿔 발행하세요.</p></div><span class="count" id="count">불러오는 중</span></section>
    <section class="grid" id="list"></section>
  </main>
  <script>
    const esc=v=>String(v||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const api=async(path,options={})=>{const response=await fetch(path,{credentials:'include',headers:{'Content-Type':'application/json'},...options}),data=await response.json().catch(()=>({}));if(!response.ok)throw Error(data.message||'요청을 처리하지 못했습니다.');return data};
    const concepts={
      'sample-community':'생활밀착 지역형','sample-policy':'데이터 정책형','sample-creator':'감각적 크리에이터형',
      'sample-consultant':'신뢰 중심 전문가형','sample-portfolio':'에디토리얼 포트폴리오형',
      'sample-trainer':'역동적 캠페인형','sample-content-director':'친근한 소통형'
    };
    const samplePreview={
      'sample-community':{name:'김도윤',role:'새봄동 주민 커뮤니티 활동가',tagline:'우리 동네의 든든한 이웃',photo:'/assets/politician-mobile-card-samples/assets/seo-rin.png'},
      'sample-policy':{name:'이준혁',role:'도시정책 데이터 연구자',tagline:'숫자 뒤에 있는 생활을 봅니다',photo:'/assets/politician-mobile-card-samples/assets/min-seok.png'},
      'sample-creator':{name:'한소연',role:'브랜드 필름 크리에이터',tagline:'사람이 기억하는 장면을 만듭니다',photo:'/assets/profile-samples/fictional-han-soyeon-creator.png'},
      'sample-consultant':{name:'박지현',role:'경영·조직 컨설턴트',tagline:'복잡한 문제를 실행 가능한 계획으로',photo:'/assets/politician-mobile-card-samples/assets/ga-eun.png'},
      'sample-portfolio':{name:'서하린',role:'브랜드 아이덴티티 디자이너',tagline:'조용하지만 분명한 첫인상',photo:'/assets/politician-mobile-card-samples/assets/yu-jin.png'},
      'sample-trainer':{name:'이도현',role:'푸른시 도의원 후보',tagline:'청년의 시작이 멈추지 않도록',photo:'/assets/profile-samples/candidate-lee-dohyun.png'},
      'sample-content-director':{name:'오유진',role:'새봄동 주민소통위원장',tagline:'듣고, 기록하고, 답하겠습니다',photo:'/assets/politician-mobile-card-samples/assets/do-yoon.png'}
    };
    const official=`<article class="card"><div class="visual theme-official"><img src="/assets/profile-samples/candidate-park-seorin.png" alt=""><div class="visual-content"><small>OFFICIAL SAMPLE</small><h2>박서린 모바일 명함</h2><p>영상 · 카드뉴스 · 공약 연결형</p></div></div><div class="meta"><strong>세련된 후보자 디지털 명함</strong><div class="stats"><span>모바일 최적화</span><span>전체 기능 체험</span></div><div class="actions"><a class="main" href="/profile-samples.html" target="_blank">샘플 보기 ↗</a><a href="/profile-studio.html?template=candidate">이 스타일로 만들기</a></div></div></article>`;
    const card=profile=>{const data={...(samplePreview[profile.slug]||{}),...(profile.profile_data||{})},photo=data.photo||'',theme='theme-'+esc(profile.slug);return`<article class="card"><div class="visual ${theme}">${photo?`<img src="${esc(photo)}" alt="">`:''}<div class="visual-content"><small>${profile.is_published?'PUBLIC SAMPLE':'DRAFT SAMPLE'}</small><h2>${esc(data.name||profile.title)}</h2><p>${esc(data.tagline||data.role||concepts[profile.slug]||'디지털 명함')}</p></div></div><div class="meta"><strong>${esc(concepts[profile.slug]||data.role||profile.title)}</strong><div class="stats"><span>방문 ${profile.stats.views}</span><span>링크 클릭 ${profile.stats.clicks}</span></div><div class="actions"><a class="main" href="/profile-studio.html?id=${profile.id}">편집</a>${profile.is_published?`<a href="/p/${esc(profile.slug)}" target="_blank">공개 보기</a>`:''}<button data-delete="${profile.id}">삭제</button></div></div></article>`};
    async function load(){try{const data=await api('/api/profiles'),samples=data.profiles.filter(profile=>profile.slug.startsWith('sample-')).slice(0,7),others=data.profiles.filter(profile=>!profile.slug.startsWith('sample-'));document.querySelector('#count').textContent=`샘플 ${samples.length+1}종`;document.querySelector('#list').innerHTML=official+samples.map(card).join('')+others.map(card).join('');document.querySelectorAll('[data-delete]').forEach(button=>button.onclick=async()=>{if(!confirm('이 디지털 명함과 통계 기록을 삭제할까요?'))return;await api('/api/profiles/'+button.dataset.delete,{method:'DELETE'});load()})}catch(error){location.href='/login.html'}}
    load();
  </script>
</body>
</html>
