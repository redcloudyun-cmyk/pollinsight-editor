<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>POLLINSIGHT | 개별 요소 라이브러리</title>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" rel="stylesheet">
  <style>body{margin:0;background:#0b1220;color:#e5edf9;font-family:Pretendard,system-ui,sans-serif}.top{height:62px;display:flex;align-items:center;gap:14px;padding:0 32px;background:#101a2c;border-bottom:1px solid #293956}.mark{font-weight:900;background:#2563eb;padding:8px;border-radius:8px}.spacer{flex:1}a{color:#b6d1ff;text-decoration:none;font-size:14px}main{max-width:1180px;margin:38px auto;padding:0 24px}h1{margin:0;font-size:26px}p{color:#9eb0ca}.note{margin:18px 0;padding:13px;border:1px solid #304462;border-radius:10px;background:#101d31;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:15px}.card{overflow:hidden;border:1px solid #2b3e5a;border-radius:12px;background:#111d31}.preview{height:135px;background:#17263d;display:grid;place-items:center}.preview img{width:100%;height:100%;object-fit:cover}.body{padding:13px}.body strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.body small{display:block;color:#91a7c8;margin:7px 0}.actions{display:flex;gap:8px}.actions button{border:0;border-radius:7px;padding:7px 9px;background:#2563eb;color:#fff;font:inherit;font-size:12px;font-weight:700;cursor:pointer}.actions .danger{background:#7f1d1d}.empty{grid-column:1/-1;padding:45px;text-align:center;color:#91a7c8;border:1px dashed #405571;border-radius:12px}@media(max-width:640px){.top{padding:0 15px}main{padding:0 15px;margin-top:24px}}</style>
</head>
<body>
  <header class="top"><span class="mark">PI</span><strong>개별 요소 라이브러리</strong><span class="spacer"></span><a href="/template-studio.html">완성형 템플릿</a><a href="/admin.html">관리자</a><a href="/index.html">편집기</a></header>
  <main><h1>클립아트 · 개별 요소 관리</h1><p>텍스트, 도형, 선, 이미지 등 하나의 편집 가능 요소를 등록하고 편집기에 삽입하는 라이브러리입니다.</p><div class="note">등록 방법: 관리자 템플릿 제작 모드에서 요소 하나를 선택한 뒤 <b>요소 등록</b>을 누르세요. 완성형 카드 세트는 별도의 완성형 템플릿으로 등록합니다.</div><p id="message"></p><section id="assets" class="grid"></section></main>
  <script>
    const request=async(path,options={})=>{const res=await fetch(path,{credentials:'include',headers:{'Content-Type':'application/json',...(options.headers||{})},...options});const data=await res.json().catch(()=>({}));if(!res.ok)throw new Error(data.message||'요청을 처리하지 못했습니다.');return data};
    const esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    async function load(){try{const me=await request('/api/auth/me');if(me.user.role!=='admin')return location.replace('/index.html');const data=await request('/api/admin/assets');const root=document.querySelector('#assets');root.innerHTML=data.assets.length?data.assets.map(a=>`<article class="card"><div class="preview">${a.preview_data?`<img src="${a.preview_data}" alt="">`:'◇'}</div><div class="body"><strong>${esc(a.title)}</strong><small>${esc(a.category)} · ${a.is_active?'공개':'비공개'}</small><div class="actions"><button data-toggle="${a.id}" data-active="${a.is_active}">${a.is_active?'비공개':'공개'}</button><button class="danger" data-delete="${a.id}">삭제</button></div></div></article>`).join(''):'<div class="empty">등록된 개별 요소가 없습니다.</div>';root.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=async()=>{await request('/api/admin/assets/'+b.dataset.toggle,{method:'PATCH',body:JSON.stringify({is_active:b.dataset.active!=='true'})});load()});root.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(!confirm('이 요소를 삭제할까요?'))return;await request('/api/admin/assets/'+b.dataset.delete,{method:'DELETE'});load()})}catch(e){document.querySelector('#message').textContent=e.message}}load();
  </script>
  <script src="/js/admin-nav.js"></script>
  <script>
    // Direct registration belongs in the asset library as well as in the editor.
    // It makes image-based clipart available without a detour through a blank canvas.
    (() => {
      const note = document.querySelector('main .note');
      if (!note) return;
      const panel = document.createElement('section');
      panel.className = 'asset-register-panel';
      panel.innerHTML = `
        <div class="asset-register-head">
          <div><strong>개별 요소 등록</strong><small>이미지 파일을 바로 등록하거나, 편집기에서 만든 텍스트·도형·선을 선택하여 등록할 수 있습니다.</small></div>
          <div class="asset-register-actions">
            <a class="asset-primary-link" href="/index.html?templateMode=1">편집기에서 선택 요소 등록</a>
            <button type="button" id="open-asset-upload">이미지 파일 등록</button>
          </div>
        </div>
        <form id="asset-upload-form" hidden>
          <label>요소 이름 / 일괄등록 접두어<input id="asset-title" maxlength="80" placeholder="비우면 파일 이름을 사용합니다"></label>
          <label>분류<select id="asset-category"><option>인물 컷아웃</option><option>클립아트</option><option>인물</option><option>아이콘</option><option>장식</option><option>로고</option><option>사진</option></select></label>
          <label>해시태그<input id="asset-tags" maxlength="180" value="인물, 전신, 정장, 컷아웃, 홍보, 카드뉴스" placeholder="인물, 전신, 정장"></label>
          <label>이미지 파일<input id="asset-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple required><small id="asset-batch-count">여러 파일을 한 번에 선택할 수 있습니다.</small></label>
          <button type="submit" id="submit-asset-upload">일괄 등록</button>
          <span id="asset-upload-status" role="status"></span>
        </form>`;
      note.insertAdjacentElement('afterend', panel);
      const style = document.createElement('style');
      style.textContent = `.asset-register-panel{margin:16px 0 20px;padding:16px;border:1px solid #31507a;border-radius:12px;background:#111e32}.asset-register-head{display:flex;align-items:center;justify-content:space-between;gap:14px}.asset-register-head strong{display:block;font-size:16px}.asset-register-head small{display:block;color:#9eb0ca;margin-top:6px}.asset-register-actions{display:flex;gap:8px;flex-wrap:wrap}.asset-register-actions button,.asset-primary-link,#asset-upload-form button{border:0;border-radius:8px;padding:9px 12px;background:#2563eb;color:#fff;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;font-size:13px}.asset-register-actions button{background:#0e7490}#asset-upload-form{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:15px;padding-top:15px;border-top:1px solid #304462}#asset-upload-form label{display:grid;gap:6px;color:#b6c9e7;font-size:12px;font-weight:700}#asset-upload-form input,#asset-upload-form select{box-sizing:border-box;width:100%;padding:9px;border:1px solid #425a7d;border-radius:7px;background:#0b1220;color:#e5edf9;font:inherit}#asset-upload-form button{align-self:end}#asset-upload-status{align-self:end;color:#9ed5b5;font-size:12px}@media(max-width:800px){.asset-register-head{align-items:flex-start;flex-direction:column}#asset-upload-form{grid-template-columns:1fr 1fr}.asset-register-actions{width:100%}}`;
      document.head.appendChild(style);
      const form = panel.querySelector('#asset-upload-form');
      panel.querySelector('#open-asset-upload').onclick = () => { form.hidden = !form.hidden; if (!form.hidden) form.querySelector('#asset-title').focus(); };
      form.querySelector('#asset-file').addEventListener('change', event => {
        const count = event.target.files?.length || 0;
        form.querySelector('#asset-batch-count').textContent = count ? `${count}개 파일을 일괄 등록합니다.` : '여러 파일을 한 번에 선택할 수 있습니다.';
      });
      form.addEventListener('submit', async event => {
        event.preventDefault();
        const files = Array.from(form.querySelector('#asset-file').files || []);
        const status = form.querySelector('#asset-upload-status');
        if (!files.length || files.some(file => !file.type.startsWith('image/'))) { status.textContent = '이미지 파일만 선택해주세요.'; return; }
        if (files.some(file => file.size > 8 * 1024 * 1024)) { status.textContent = '각 파일은 8MB 이하만 등록할 수 있습니다.'; return; }
        const submit = form.querySelector('#submit-asset-upload');
        submit.disabled = true; status.textContent = `0/${files.length} 등록 중…`;
        try {
          const prefix = form.querySelector('#asset-title').value.trim();
          const category = form.querySelector('#asset-category').value;
          const tags = [...new Set(['인물', '전신', '정장', '컷아웃', '홍보', '카드뉴스', ...form.querySelector('#asset-tags').value.split(',').map(tag => tag.replace(/^#/, '').trim()).filter(Boolean)])];
          for (const [index, file] of files.entries()) {
            const src = await new Promise((resolve, reject) => { const reader = new FileReader(); reader.onload = () => resolve(reader.result); reader.onerror = reject; reader.readAsDataURL(file); });
            const image = await new Promise((resolve, reject) => { const img = new Image(); img.onload = () => resolve(img); img.onerror = reject; img.src = src; });
            const scale = Math.min(1, 600 / Math.max(image.width || 1, image.height || 1));
            const fileName = file.name.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ').trim() || `인물 요소 ${index + 1}`;
            await request('/api/admin/assets', { method:'POST', body:JSON.stringify({
              title: prefix ? `${prefix} ${String(index + 1).padStart(2, '0')}` : fileName,
              asset_type: category === '인물 컷아웃' ? 'person_cutout' : 'clipart', category, tags, preview_data:src,
              element_data:{ type:'image', imgSrc:src, x:0, y:0, w:Math.round(image.width * scale), h:Math.round(image.height * scale), rot:0, opacity:1 }
            }) });
            status.textContent = `${index + 1}/${files.length} 등록 중…`;
          }
          status.textContent = `${files.length}개 요소를 등록했습니다. 편집기 요소 탭에서 바로 사용할 수 있습니다.`;
          form.reset();
          form.querySelector('#asset-batch-count').textContent = '여러 파일을 한 번에 선택할 수 있습니다.';
          await load();
        } catch (error) { status.textContent = error.message || '요소를 등록하지 못했습니다.'; }
        finally { submit.disabled = false; }
      });
    })();
  </script>
</body>
</html>
