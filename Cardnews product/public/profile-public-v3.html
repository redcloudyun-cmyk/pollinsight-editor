<body>
  <div class="shell" id="app"><p class="loading">디지털 명함을 불러오는 중입니다.</p></div>
  <script>
    const esc=v=>String(v||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const safeUrl=v=>{try{const u=new URL(v,location.origin);return ['http:','https:','mailto:','tel:'].includes(u.protocol)?u.href:''}catch{return ''}};
    const youtubeId=v=>{try{const u=new URL(v);if(u.hostname==='youtu.be')return u.pathname.split('/')[1]||'';if(['youtube.com','www.youtube.com','m.youtube.com'].includes(u.hostname))return u.searchParams.get('v')||u.pathname.split('/embed/')[1]||u.pathname.split('/shorts/')[1]||''}catch{}return ''};
    const slug=location.pathname.split('/').pop(),track=target=>fetch('/api/public-profiles/'+encodeURIComponent(slug)+'/click',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({target})}).catch(()=>{});
    const trackedLink=(label,url)=>{const href=safeUrl(url);return href?`<a class="link-button" href="${href}" target="${href.startsWith('http')?'_blank':'_self'}" rel="noopener" data-track="${esc(url)}"><span>${esc(label)}</span><span>↗</span></a>`:''};
    async function run(){
      const response=await fetch('/api/public-profiles/'+encodeURIComponent(slug)),payload=await response.json().catch(()=>({}));if(!response.ok)throw Error(payload.message||'공개 페이지를 찾을 수 없습니다.');
      const profile=payload.profile,data=profile.profile_data||{},pages=Array.isArray(data.pages)?data.pages:[],videos=pages.filter(p=>p.type==='video'&&youtubeId(p.videoUrl)),pledgePages=pages.filter(p=>p.type==='pledge'),portfolio=Array.isArray(data.portfolio)?data.portfolio:[],cards=[...pages.filter(p=>['custom','greeting'].includes(p.type)),...portfolio.map((p,i)=>({id:'portfolio-'+i,title:p.title,heading:p.title,body:'카드뉴스와 주요 활동 내용을 확인해 보세요.',image:p.image,buttonUrl:p.url}))],socialMeta={facebook:['f','Facebook'],youtube:['▶','YouTube'],instagram:['◎','Instagram'],blog:['B','Blog']};
      document.title=(data.name||profile.title)+' | 디지털 명함';
      document.querySelector('#app').className='shell theme-'+String(profile.slug||slug).replace(/[^a-z0-9-]/g,'');
      const socials=Object.entries(data.social||{}).map(([key,url])=>{const meta=socialMeta[key],href=safeUrl(url);return meta&&href?`<a href="${href}" target="_blank" rel="noopener" data-track="${esc(url)}"><b>${meta[0]}</b><span>${meta[1]}</span></a>`:''}).join('');
      const heroPhoto=data.photo?`<img class="hero-photo" src="${esc(data.photo)}" alt="${esc(data.name||'프로필')}">`:'',inquiry=safeUrl(data.inquiryUrl||data.messageUrl);
      const videoHtml=videos.map(p=>`<div class="video"><iframe src="https://www.youtube-nocookie.com/embed/${esc(youtubeId(p.videoUrl))}?rel=0" title="${esc(p.heading||p.title)}" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div><div class="video-copy"><strong>${esc(p.heading||p.title)}</strong><p>${esc(p.body||'')}</p></div>`).join('');
      const cardHtml=cards.map((p,i)=>`<article class="news">${p.image?`<img src="${esc(p.image)}" alt="">`:''}<small>STORY ${String(i+1).padStart(2,'0')}</small><div><h3>${esc(p.heading||p.title)}</h3><p>${esc(p.body||'')}</p>${safeUrl(p.buttonUrl)?`<a href="${safeUrl(p.buttonUrl)}" data-track="${esc(p.buttonUrl)}">자세히 보기 ↗</a>`:''}</div></article>`).join('');
      const pledges=pledgePages.flatMap(p=>String(p.body||'').split(/\n+/).map(line=>line.trim()).filter(Boolean).map((line,i)=>{const parts=line.split(/[:：]/);return{title:parts.length>1?parts.shift().trim():(p.heading||'핵심 공약 '+(i+1)),body:parts.length?parts.join(':').trim():line}}));
      const pledgeHtml=pledges.map((p,i)=>`<details><summary><span class="num">${String(i+1).padStart(2,'0')}</span><strong>${esc(p.title)}</strong><span class="plus">＋</span></summary><div class="detail">${esc(p.body)}</div></details>`).join('');
      const pageLinks=pages.filter(p=>p.buttonUrl&&p.type!=='video').map(p=>trackedLink(p.buttonLabel||p.title,p.buttonUrl)).join(''),extraLinks=[...(data.links||[]),...(data.resources||[])].map(p=>trackedLink(p.label||p.title,p.url)).join(''),certificate=pages.some(p=>p.type==='certificate');
      document.querySelector('#app').innerHTML=`<header class="hero">${heroPhoto}<div class="topbar"><div class="brand"><span class="mark">${esc((data.name||'P').slice(0,1))}</span><span>${esc(data.name||profile.title)}의 디지털 명함</span></div><button class="share" id="share">↗</button></div><div class="identity"><div class="eyebrow">${esc(data.role||'')}</div><h1>${esc(data.name||profile.title)}</h1><p>생활에서 답을 찾는 사람</p><p class="slogan">${esc(data.bio||'반갑습니다. 저의 활동과 약속을 소개합니다.')}</p></div></header><nav class="quick">${data.phone?`<a href="tel:${esc(data.phone)}" data-track="tel:${esc(data.phone)}"><span class="qicon">☎</span><span>전화</span></a>`:'<a href="#links"><span class="qicon">☎</span><span>연락</span></a>'}${data.email?`<a href="mailto:${esc(data.email)}" data-track="mailto:${esc(data.email)}"><span class="qicon">✉</span><span>이메일</span></a>`:'<a href="#stories"><span class="qicon">▣</span><span>소식</span></a>'}<a href="#pledges"><span class="qicon">✓</span><span>공약</span></a><button id="share2"><span class="qicon">↗</span><span>공유</span></button></nav><main><section class="section"><div class="section-head"><h2>안녕하세요, ${esc(data.name||'반갑습니다')}입니다</h2></div><p class="intro">${esc(data.bio||'활동과 약속을 소개합니다.')}</p></section>${socials?`<section class="section"><div class="section-head"><h2>SNS에서 만나요</h2><span>공식 계정 바로가기</span></div><div class="socials">${socials}</div></section>`:''}${videoHtml?`<section class="section"><div class="section-head"><h2>영상으로 전하는 이야기</h2><span>YouTube</span></div>${videoHtml}</section>`:''}${cardHtml?`<section class="section" id="stories"><div class="section-head"><h2>카드로 보는 소식</h2><span>옆으로 넘겨보세요</span></div><div class="carousel">${cardHtml}</div></section>`:''}${pledgeHtml?`<section class="section" id="pledges"><div class="section-head"><h2>주요 공약</h2><span>눌러서 자세히 보기</span></div><div class="pledges">${pledgeHtml}</div></section>`:''}${pageLinks||extraLinks?`<section class="section" id="links"><div class="section-head"><h2>더 알아보기</h2></div><div class="link-list">${pageLinks}${extraLinks}</div></section>`:''}${certificate?`<section class="section"><div class="section-head"><h2>함께하기</h2></div><form class="form" id="certificate-form"><input name="name" required maxlength="100" placeholder="이름"><input name="phone" maxlength="40" placeholder="휴대전화"><input name="email" maxlength="255" placeholder="이메일"><textarea name="message" maxlength="2000" placeholder="전달할 내용 (선택)"></textarea><label><input type="checkbox" name="consent" required> 연락을 위한 개인정보 수집에 동의합니다.</label><button class="submit">신청 제출</button><span class="notice" id="application-notice"></span></form></section>`:''}</main><div class="bottom"><a class="outline" href="/api/public-profiles/${encodeURIComponent(slug)}/vcard">연락처 저장</a>${inquiry?`<a class="primary" href="${inquiry}" data-track="${esc(data.inquiryUrl||data.messageUrl)}">의견 보내기</a>`:'<button class="primary" id="bottom-share">명함 공유하기</button>'}</div><div class="toast" id="toast">주소를 복사했습니다.</div>`;
      const identityLine=document.querySelector('.identity p:not(.slogan)');if(identityLine)identityLine.textContent=data.tagline||data.role||'';
      const main=document.querySelector('main'),allSections=[...main.querySelectorAll(':scope > .section')],findSection=selector=>allSections.find(section=>section.querySelector(selector)),introSection=allSections[0],socialSection=findSection('.socials'),videoSection=findSection('.video'),storySection=document.querySelector('#stories'),pledgeSection=document.querySelector('#pledges'),linkSection=document.querySelector('#links'),formSection=findSection('.form');
      const compositions={
        'sample-community':[introSection,pledgeSection,storySection,videoSection,socialSection,linkSection,formSection],
        'sample-policy':[videoSection,pledgeSection,storySection,introSection,socialSection,linkSection,formSection],
        'sample-creator':[introSection,storySection,videoSection,socialSection,pledgeSection,linkSection,formSection],
        'sample-consultant':[introSection,pledgeSection,linkSection,storySection,videoSection,socialSection,formSection],
        'sample-portfolio':[storySection,introSection,videoSection,pledgeSection,socialSection,linkSection,formSection],
        'sample-trainer':[pledgeSection,videoSection,storySection,introSection,socialSection,linkSection,formSection],
        'sample-content-director':[storySection,pledgeSection,introSection,videoSection,formSection,socialSection,linkSection]
      };
      (compositions[profile.slug]||allSections).filter(Boolean).forEach(section=>main.append(section));
      const labels={
        'sample-community':['활동 이야기','주민 약속'],
        'sample-policy':['정책 카드','측정 지표'],
        'sample-creator':['Selected Works','Our Process'],
        'sample-consultant':['함께 해결하는 영역','프로젝트 원칙'],
        'sample-portfolio':['Selected Projects','Design Process'],
        'sample-trainer':['공약 카드','핵심 공약'],
        'sample-content-director':['동네 소식','소통 원칙']
      }[profile.slug];
      if(labels&&storySection)storySection.querySelector('h2').textContent=labels[0];
      if(labels&&pledgeSection)pledgeSection.querySelector('h2').textContent=labels[1];
      document.querySelector('#app').dataset.layout=profile.slug;
      const share=async()=>{try{if(navigator.share)await navigator.share({title:document.title,text:(data.name||profile.title)+'의 디지털 명함',url:location.href});else{await navigator.clipboard.writeText(location.href);const t=document.querySelector('#toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}}catch{}};document.querySelector('#share').onclick=share;document.querySelector('#share2').onclick=share;document.querySelector('#bottom-share')?.addEventListener('click',share);document.querySelectorAll('[data-track]').forEach(a=>a.addEventListener('click',()=>track(a.dataset.track||a.href)));
      document.querySelector('#certificate-form')?.addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target),notice=document.querySelector('#application-notice');notice.textContent='제출 중입니다…';const r=await fetch('/api/public-profiles/'+encodeURIComponent(slug)+'/applications',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:f.get('name'),phone:f.get('phone'),email:f.get('email'),message:f.get('message'),consent:f.get('consent')==='on'})}),result=await r.json().catch(()=>({}));notice.textContent=r.ok?'신청이 접수되었습니다. 감사합니다.':(result.message||'신청하지 못했습니다.');if(r.ok)e.target.reset()});
    }
    run().catch(error=>{document.querySelector('#app').innerHTML=`<p class="loading">${esc(error.message)}</p>`});
  </script>
