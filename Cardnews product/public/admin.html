<!doctype html>
<html lang="ko">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>POLLINSIGHT | 관리자</title><link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" rel="stylesheet"><style>
body{margin:0;background:#0b1220;color:#e5edf9;font-family:Pretendard,system-ui,sans-serif}.top{height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;border-bottom:1px solid #293956;background:#101a2c}.mark{font-weight:900;color:#fff;background:#3b82f6;padding:8px;border-radius:8px}main{max-width:1180px;margin:40px auto;padding:0 24px}h1{font-size:25px}p{color:#9eb0ca}.card{background:#111d31;border:1px solid #2b3e5a;border-radius:14px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:840px}th,td{padding:14px;border-bottom:1px solid #283a55;text-align:left;font-size:13px}th{color:#91a7c8;background:#15243a}select,button{background:#0d1727;border:1px solid #405571;color:#e5edf9;border-radius:7px;padding:8px;font:inherit}button{cursor:pointer;background:#2563eb;border:0}button:hover{background:#1d4ed8}.hidden{display:none}#message{min-height:20px;color:#facc15}a{color:#b6d1ff;text-decoration:none}
</style></head>
<body><header class="top"><div><span class="mark">PI</span> <strong>회원 관리</strong></div><div><a href="/template-studio.html">템플릿 제작</a>　<a href="/index.html">편집기로 돌아가기</a></div></header><main><h1>회원 관리</h1><p>회원 상태, 소속 테마, 플랜을 관리합니다. 결제 연동 전에는 플랜 변경이 관리자 수동 처리입니다.</p><p id="message"></p><section class="card"><table><thead><tr><th>회원</th><th>소속 테마</th><th>플랜</th><th>역할</th><th>상태</th><th>저장</th></tr></thead><tbody id="users"></tbody></table></section></main>
<script>
const party={democratic:'민주당 계열',people_power:'국민의힘 계열',justice:'정의당 계열',independent:'무소속'};const tier={free:'무료',basic:'베이직',premium:'프리미엄'};const option=(map,current)=>Object.entries(map).map(([v,n])=>`<option value="${v}" ${v===current?'selected':''}>${n}</option>`).join('');
async function load(){const me=await fetch('/api/auth/me');if(!me.ok){location.replace('/login.html');return}const account=(await me.json()).user;if(account.role!=='admin'){location.replace('/index.html');return}const res=await fetch('/api/admin/users');const data=await res.json();if(!res.ok){document.getElementById('message').textContent=data.message;return}document.getElementById('users').innerHTML=data.users.map(u=>`<tr data-id="${u.id}"><td><strong>${u.displayName}</strong><br><small>${u.email}</small></td><td><select class="party">${option(party,u.party)}</select></td><td><select class="tier">${option(tier,u.tier)}</select></td><td><select class="role"><option value="member" ${u.role==='member'?'selected':''}>회원</option><option value="admin" ${u.role==='admin'?'selected':''}>관리자</option></select></td><td><select class="active"><option value="true" ${u.isActive?'selected':''}>활성</option><option value="false" ${!u.isActive?'selected':''}>중지</option></select></td><td><button class="save">저장</button></td></tr>`).join('');document.querySelectorAll('.save').forEach(button=>button.onclick=async()=>{const row=button.closest('tr');const body={party:row.querySelector('.party').value,tier:row.querySelector('.tier').value,role:row.querySelector('.role').value,isActive:row.querySelector('.active').value==='true'};const res=await fetch('/api/admin/users/'+row.dataset.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});document.getElementById('message').textContent=res.ok?'저장했습니다.':(await res.json()).message})}load();
</script><script>
async function loadUsageDashboard(){try{const response=await fetch('/api/admin/dashboard',{credentials:'include'});const data=await response.json();if(!response.ok)return;const d=data.dashboard;const main=document.querySelector('main');const box=document.createElement('section');box.id='usage-dashboard';box.innerHTML=`<h2 style="margin-top:28px">이번 달 운영 현황</h2><div style="display:grid;grid-template-columns:repeat(5,minmax(120px,1fr));gap:10px;margin:14px 0 18px"><div class="card" style="padding:14px"><small>활성 회원</small><h2>${d.members}</h2></div><div class="card" style="padding:14px"><small>이번 달 활동 회원</small><h2>${d.activeMembers}</h2></div><div class="card" style="padding:14px"><small>AI 요청</small><h2>${d.aiRequests}</h2></div><div class="card" style="padding:14px"><small>편집 시간</small><h2>${d.editorMinutes}분</h2></div><div class="card" style="padding:14px"><small>사용 크레딧</small><h2>${d.creditsUsed} C</h2></div></div><section class="card" style="margin-bottom:18px"><table><thead><tr><th>회원 사용 현황</th><th>플랜</th><th>잔여 크레딧</th><th>편집 시간</th><th>AI 요청</th></tr></thead><tbody>${d.users.map(u=>`<tr><td><strong>${u.display_name}</strong><br><small>${u.email}</small></td><td>${u.tier}</td><td>${u.credit_balance} C</td><td>${Math.round(u.editor_seconds/60)}분</td><td>${u.ai_requests}회</td></tr>`).join('')}</tbody></table></section>`;main.insertBefore(box,main.querySelector('.card'))}catch(e){console.warn(e)}}loadUsageDashboard();
</script><script src="/js/admin-nav.js"></script></body></html>
