<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>POLLINSIGHT | 명함 성과</title>
<style>
:root{--blue:#2563eb;--ink:#172033;--muted:#64748b;--line:#dbe3ee}*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:var(--ink);font-family:Pretendard,system-ui,sans-serif}.top{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:13px;padding:0 30px}.mark{padding:8px 10px;border-radius:9px;background:var(--blue);color:#fff;font-weight:900}.spacer{flex:1}a{text-decoration:none;color:#526075;font-size:14px}.shell{max-width:1060px;margin:auto;padding:34px 22px}.heading h1{margin:0;font-size:28px}.heading p{color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:24px 0}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:17px}.card small{color:var(--muted);font-weight:700}.card strong{display:block;margin-top:8px;font-size:28px}.card b{font-size:13px;color:#2563eb}.panel h2{font-size:16px;margin:0 0 12px}.event{display:grid;grid-template-columns:150px 1fr 150px;gap:12px;padding:12px 0;border-bottom:1px solid #edf1f6;font-size:14px}.event:last-child{border:0}.event time{color:var(--muted);font-size:12px}.empty{color:var(--muted);padding:35px;text-align:center}@media(max-width:760px){.top{padding:0 15px}.shell{padding:24px 14px}.cards{grid-template-columns:repeat(2,1fr)}.event{grid-template-columns:1fr}.top a{font-size:12px}}
</style></head><body><header class="top"><span class="mark">PI</span><strong>명함 성과</strong><span class="spacer"></span><a id="editor" href="/profiles.html">편집기로 돌아가기</a><a href="/profiles.html">내 명함</a></header><main class="shell"><section class="heading"><h1 id="title">디지털 명함 성과</h1><p>공개 후 발생한 조회, 연결, 연락처 저장 및 신청 전환을 확인합니다.</p></section><section class="cards" id="cards"></section><section class="panel"><h2>최근 활동</h2><div id="events"><p class="empty">불러오는 중입니다.</p></div></section></main><script>
const $=id=>document.getElementById(id),api=async p=>{const r=await fetch(p,{credentials:'include'}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||'성과를 불러올 수 없습니다.');return d};const labels={view:'조회',link_click:'링크 클릭',contact_save:'연락처 저장',application_submit:'신청 접수'};const fmt=v=>new Intl.DateTimeFormat('ko-KR',{dateStyle:'medium',timeStyle:'short'}).format(new Date(v));async function run(){try{const id=new URLSearchParams(location.search).get('id');if(!id)throw Error('먼저 명함을 선택해 주세요.');$('editor').href='/profile-studio.html?id='+encodeURIComponent(id);const [profile,analytics]=await Promise.all([api('/api/profiles/'+id),api('/api/profiles/'+id+'/analytics')]);$('title').textContent=profile.profile.title+' · 성과';const s=analytics.stats;$('cards').innerHTML=[['조회',s.views],['링크 클릭',s.clicks],['연락처 저장',s.contactSaves],['신청 접수',s.applications],['전체 전환율',s.conversionRate+'%']].map(([k,v])=>'<article class="card"><small>'+k+'</small><strong>'+v+'</strong>'+ (k==='전체 전환율'?'<b>조회 대비 전환</b>':'')+'</article>').join('');$('events').innerHTML=analytics.events.length?analytics.events.map(e=>'<div class="event"><strong>'+ (labels[e.event_type]||e.event_type)+'</strong><span>'+String(e.target||'디지털 명함').replace(/[&<>]/g,'')+'</span><time>'+fmt(e.created_at)+'</time></div>').join(''):'<p class="empty">아직 기록된 활동이 없습니다.</p>'}catch(e){$('events').innerHTML='<p class="empty">'+e.message+'</p>'}}run();
</script></body></html>
