<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>프로필</title><style>
*{box-sizing:border-box}body{margin:0;background:#0d1220;color:#fff;font-family:Pretendard,system-ui,sans-serif}.page{min-height:100vh;max-width:540px;margin:auto;padding:26px 21px 48px;background:linear-gradient(155deg,#1c2945,#101522)}.page.portfolio{background:linear-gradient(155deg,#123653,#111827)}.page.campaign{background:linear-gradient(155deg,#173e89,#111827)}.page.creator{background:linear-gradient(155deg,#4c1d95,#111827)}.page.consultant{background:linear-gradient(155deg,#14532d,#10231a)}.page.local{background:linear-gradient(155deg,#075985,#10202e)}.page.candidate{background:linear-gradient(155deg,#7f1d1d,#211316)}.page.business{background:linear-gradient(155deg,#3f3f46,#18181b)}.page.speaker{background:linear-gradient(155deg,#9a3412,#24170f)}.brand{font-size:12px;font-weight:900;letter-spacing:.09em;opacity:.74}.hero{text-align:center;padding:22px 0}.photo{width:118px;height:118px;margin:auto;border-radius:50%;background:#64748b center/cover;border:4px solid #ffffff55}.name{font-size:30px;margin:15px 0 5px}.role{margin:0;color:#b8d2ff}.bio{line-height:1.7;color:#e2eaf7}.contacts,.links{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:15px 0}.button{display:block;padding:13px 9px;border:1px solid #ffffff2b;border-radius:12px;text-align:center;color:#fff;background:#ffffff12;text-decoration:none;font-size:13px;font-weight:800}.primary{background:#2563eb}.tabs{display:flex;gap:7px;overflow:auto;margin:12px -2px 18px;padding:2px}.tab{white-space:nowrap;border:1px solid #ffffff25;border-radius:999px;background:#ffffff0d;color:#e9effb;padding:8px 12px;font:inherit;font-size:12px;cursor:pointer}.tab.active{background:#fff;color:#152038;font-weight:800}.content{border:1px solid #ffffff22;background:#07101f35;border-radius:17px;padding:20px;min-height:245px}.content h2{font-size:25px;margin:0 0 12px}.content p{line-height:1.75;white-space:pre-wrap;color:#e4ebf7}.page-image{width:100%;border-radius:11px;max-height:280px;object-fit:cover;margin:0 0 14px}.empty{padding:90px 20px;text-align:center;color:#bdc9dc}</style></head><body><main id="app" class="page"><p class="empty">페이지를 불러오는 중입니다.</p></main><script>
const $=id=>document.getElementById(id),esc=v=>String(v||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const valid=u=>{try{const x=new URL(u);return ['http:','https:','mailto:','tel:'].includes(x.protocol)?x.href:''}catch{return ''}};const youtubeId=value=>{try{const u=new URL(value);if(u.hostname==='youtu.be')return u.pathname.split('/').filter(Boolean)[0]||'';if(['www.youtube.com','youtube.com','m.youtube.com'].includes(u.hostname)){if(u.pathname==='/watch')return u.searchParams.get('v')||'';if(u.pathname.startsWith('/embed/'))return u.pathname.split('/')[2]||''}}catch{}return ''};
async function run(){const slug=location.pathname.split('/').pop(),res=await fetch('/api/public-profiles/'+encodeURIComponent(slug)),out=await res.json();if(!res.ok)throw Error();const p=out.profile,d=p.profile_data||{};document.title=(d.name||p.title)+' | 프로필';const action=(label,url,cls='')=>{const safe=valid(url);return safe?`<a class="button ${cls}" href="${safe}" data-track data-target="${esc(url)}">${esc(label)}</a>`:''};const base={id:'intro',type:'intro',title:'소개',heading:d.name||p.title,body:d.bio||'',image:'',videoUrl:'',buttonLabel:d.inquiryUrl||d.messageUrl?'문의하기':'',buttonUrl:d.inquiryUrl||d.messageUrl||''};const pages=Array.isArray(d.pages)&&d.pages.length?d.pages:[base];let selected=0;const render=()=>{const page=pages[selected],videoId=page.type==='video'?youtubeId(page.videoUrl):'',contacts=[action('전화',d.phone?'tel:'+d.phone:''),action('이메일',d.email?'mailto:'+d.email:'')].filter(Boolean).join(''),links=(d.links||[]).map(v=>action(v.label||'링크',v.url)).filter(Boolean).join('');$('app').className='page '+esc(p.template_key);$('app').innerHTML=`<div class="brand">POLLINSIGHT PROFILE</div><section class="hero"><div class="photo" style="background-image:url('${esc(d.photo||'')}')"></div><h1 class="name">${esc(d.name||p.title)}</h1><p class="role">${esc(d.role)}</p></section><div class="contacts">${contacts}</div>${links?`<div class="links">${links}</div>`:''}<nav class="tabs">${pages.map((x,i)=>`<button class="tab ${i===selected?'active':''}" data-page="${i}">${esc(x.title||'페이지 '+(i+1))}</button>`).join('')}</nav><section class="content">${page.image?`<img class="page-image" src="${esc(page.image)}" alt="">`:''}${videoId?`<div style="position:relative;padding-top:56.25%;margin-bottom:14px"><iframe title="YouTube video" src="https://www.youtube-nocookie.com/embed/${esc(videoId)}" style="position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:11px" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>`:''}<h2>${esc(page.heading||page.title)}</h2><p>${esc(page.body)}</p>${action(page.buttonLabel||'자세히 보기',page.buttonUrl,'primary')}</section>`;document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.page);render()});document.querySelectorAll('[data-track]').forEach(a=>a.onclick=()=>fetch('/api/public-profiles/'+encodeURIComponent(slug)+'/click',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({target:a.dataset.target||a.href})}))};render()}run().catch(()=>{$('app').innerHTML='<p class="empty">공개 페이지를 찾을 수 없습니다.</p>'});
</script></body></html>
