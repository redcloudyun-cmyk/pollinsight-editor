<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>POLLINSIGHT | 내 작업</title>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    :root{--accent:#2563eb}*{box-sizing:border-box}body{margin:0;background:#f6f8fc;color:#172033;font-family:Pretendard,system-ui,sans-serif}.top{height:64px;background:#fff;border-bottom:1px solid #e6eaf1;display:flex;align-items:center;padding:0 32px;gap:18px}.logo{font-weight:900;letter-spacing:.04em}.mark{background:var(--accent);color:#fff;padding:7px 9px;border-radius:9px}.spacer{flex:1}button,a{font:inherit}.top a,.top button{border:0;background:transparent;color:#526075;text-decoration:none;cursor:pointer}.primary{background:var(--accent)!important;color:white!important;border-radius:9px!important;padding:10px 14px!important;font-weight:800}.layout{display:grid;grid-template-columns:260px 1fr;max-width:1600px;margin:auto;min-height:calc(100vh - 64px)}aside{background:#fff;border-right:1px solid #e6eaf1;padding:28px 20px}.profile{padding:18px;border-radius:14px;background:#f2f6ff;margin-bottom:24px}.profile strong{display:block;margin-bottom:5px}.profile small{color:#66748a}.nav-title{color:#8794a9;font-size:12px;font-weight:800;margin:20px 10px 8px}.folder-list{display:grid;gap:5px}.folder{width:100%;border:0;background:transparent;border-radius:8px;padding:10px;text-align:left;display:flex;gap:9px;align-items:center;cursor:pointer;color:#4b5a70}.folder:hover,.folder.active{background:#edf4ff;color:#174ea6;font-weight:800}.folder em{margin-left:auto;font-style:normal;font-size:12px;color:#8190a5}.content{padding:34px;min-width:0}.title-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.title-row h1{font-size:25px;margin:0}.search{margin-left:auto;width:min(310px,100%);padding:11px 13px;border:1px solid #dce3ef;border-radius:9px;background:white}.folder-row{display:flex;gap:10px;overflow:auto;padding:25px 0 20px}.folder-card{min-width:200px;padding:17px;background:#fff;border:1px solid #e0e6ef;border-radius:10px;display:flex;gap:10px;align-items:center;cursor:pointer}.folder-card:hover{border-color:var(--accent)}.folder-card small{margin-left:auto;color:#748198}.project-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}.new-card,.project{border:1px solid #e0e6ef;background:#fff;border-radius:12px;overflow:hidden;min-height:260px}.new-card{display:grid;place-items:center;cursor:pointer;color:#526075;gap:8px;border:2px dashed #cdd8e8}.new-card i{font-size:30px;color:var(--accent)}.preview{height:170px;background:linear-gradient(135deg,#dbeafe,#f8fafc);display:grid;place-items:center;overflow:hidden}.preview img{width:100%;height:100%;object-fit:cover}.preview i{font-size:38px;color:#94a3b8}.meta{padding:14px}.meta strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta small{display:block;color:#7b879a;margin-top:7px}.actions{display:flex;gap:7px;margin-top:12px}.actions button{border:1px solid #dce3ef;background:#fff;border-radius:7px;padding:6px 8px;cursor:pointer;color:#526075}.empty{grid-column:1/-1;padding:55px;text-align:center;color:#7b879a;background:#fff;border-radius:12px}.delete-folder{margin-left:auto;color:#a1aabc!important}.mobile-filters{display:none}
    @media(max-width:760px){.top{height:56px;padding:0 14px}.top .account{display:none}.layout{display:block}.layout aside{display:none}.content{padding:20px 14px}.mobile-filters{display:flex;gap:8px;overflow:auto;margin:14px 0}.mobile-filters button{white-space:nowrap;border:1px solid #dce3ef;border-radius:999px;padding:8px 11px;background:#fff;color:#526075}.mobile-filters button.active{background:#edf4ff;color:#174ea6;border-color:#9fc2ff}.title-row h1{font-size:21px}.search{order:3;width:100%;margin:0}.folder-row{padding:16px 0}.folder-card{min-width:170px}.project-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.new-card,.project{min-height:210px}.preview{height:126px}.meta{padding:10px}.actions{gap:4px}.actions button{padding:5px}.folder-row{display:none}}
  </style>
</head>
<body>
 <header class="top"><span class="mark">PI</span><strong class="logo">POLLINSIGHT</strong><span class="spacer"></span><a class="account" href="/profiles.html">디지털 명함</a><a class="account" href="/account.html">내 구독</a><button id="logout">로그아웃</button><a class="primary" href="/index.html">새 디자인</a></header>
 <div class="layout"><aside><div class="profile"><strong id="profile-name">내 작업</strong><small id="profile-info">프로젝트를 불러오는 중입니다.</small></div><div class="nav-title">내 폴더</div><div id="sidebar-folders" class="folder-list"></div><button id="new-folder" class="folder" style="margin-top:10px"><i class="ph-bold ph-folder-plus"></i> 새 폴더</button></aside>
 <main class="content"><div class="title-row"><h1 id="heading">모든 작업</h1><input id="search" class="search" placeholder="프로젝트 제목 검색"></div><div id="mobile-folders" class="mobile-filters"></div><section id="folder-row" class="folder-row"></section><section id="projects" class="project-grid"></section></main></div>
 <script type="module" src="/js/workspace.js"></script>
 <script src="/js/support-chat.js"></script>
</body></html>
