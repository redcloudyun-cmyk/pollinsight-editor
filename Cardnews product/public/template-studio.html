<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>POLLINSIGHT | 템플릿 제작</title>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    :root{--accent:#2563eb}*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#e5edf9;font-family:Pretendard,system-ui,sans-serif}.top{height:62px;display:flex;align-items:center;gap:14px;padding:0 32px;border-bottom:1px solid #293956;background:#101a2c}.mark{font-weight:900;color:#fff;background:var(--accent);padding:8px;border-radius:8px}.spacer{flex:1}a,button,input,select{font:inherit;color:inherit;text-decoration:none}button,.primary{border:0;border-radius:8px;padding:10px 13px;cursor:pointer;background:#2563eb;color:#fff;font-weight:800}.secondary{background:#17263d;border:1px solid #405571}.nav-link{color:#b6d1ff;font-size:14px}.nav-link:hover{color:#fff;text-decoration:underline}.primary:hover,button:hover{filter:brightness(1.08)}main{max-width:1200px;margin:38px auto;padding:0 24px}h1{margin:0;font-size:26px}p{color:#9eb0ca;line-height:1.6}.notice{margin:22px 0;padding:15px 18px;border:1px solid #304462;border-radius:12px;background:#101d31;color:#cbd9ee;font-size:13px}.filters{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.filters input,.filters select{background:#111d31;border:1px solid #405571;border-radius:8px;padding:10px 12px;color:#e5edf9}.filters input{min-width:250px}.tag-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.tag{border:1px solid #405571;border-radius:999px;padding:6px 9px;background:#17263d;color:#bfd4f5;font-size:12px;cursor:pointer}.tag.active{background:#2563eb;border-color:#60a5fa;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:16px;margin-top:24px}.card{overflow:hidden;border:1px solid #2b3e5a;border-radius:12px;background:#111d31}.preview{height:150px;background:linear-gradient(135deg,#1c3155,#101a2c);display:grid;place-items:center;overflow:hidden;color:#7891b3}.preview img{width:100%;height:100%;object-fit:cover}.meta{padding:14px}.meta strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta small{display:block;color:#91a7c8;margin:7px 0 12px}.card-tags{display:flex;gap:5px;flex-wrap:wrap;min-height:25px}.card-tags span{font-size:11px;color:#c4b5fd;background:#2e2354;border-radius:999px;padding:3px 6px}.actions{display:flex;gap:8px;margin-top:10px}.actions button{padding:7px 9px;font-size:12px}.empty{grid-column:1/-1;padding:50px;text-align:center;border:1px dashed #405571;border-radius:12px;color:#91a7c8}@media(max-width:640px){.top{padding:0 14px}.top strong{display:none}main{padding:0 15px;margin-top:24px}.primary{font-size:13px}.filters input{min-width:0;width:100%}}
  </style>
</head>
<body>
  <header class="top"><span class="mark">PI</span><strong>템플릿 제작 모드</strong><span class="spacer"></span><a class="nav-link" href="/admin.html">회원 관리</a><a class="nav-link" href="/index.html">편집기</a></header>
  <main>
    <h1>공용 템플릿 관리</h1>
    <p>관리자가 요소별 역할과 잠금 상태를 지정한 디자인을 공용 템플릿으로 등록합니다.</p>
    <a class="primary" href="/index.html?templateMode=1"><i class="ph-bold ph-plus"></i> 새 템플릿 제작</a>
    <div class="notice">제작 순서: 요소 배치 → 각 요소에 역할 지정 → 잠금 요소 지정 → 상단의 ‘템플릿 등록’을 눌러 저장. 등록된 템플릿은 공개 상태일 때 일반 회원에게 제공됩니다.</div>
    <div class="filters"><input id="template-search" placeholder="템플릿 이름 또는 #해시태그 검색"><select id="template-category"><option value="">모든 분류</option></select></div><div id="template-tags" class="tag-row"></div>
    <p id="message"></p><section id="templates" class="grid"></section>
  </main>
  <script>
    const request=async(path,options={})=>{const res=await fetch(path,{credentials:'include',headers:{'Content-Type':'application/json',...(options.headers||{})},...options});const data=await res.json().catch(()=>({}));if(!res.ok)throw new Error(data.message||'요청을 처리하지 못했습니다.');return data};
    const esc=value=>String(value||'').replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    async function load(){try{const me=await request('/api/auth/me');if(me.user.role!=='admin')return location.replace('/index.html');const data=await request('/api/admin/templates');const root=document.querySelector('#templates');root.innerHTML=data.templates.length?data.templates.map(t=>`<article class="card"><div class="preview">${t.preview_data?`<img src="${t.preview_data}" alt="">`:'<i class="ph-duotone ph-layout text-4xl"></i>'}</div><div class="meta"><strong>${esc(t.title)}</strong><small>${esc(t.category)} · ${t.is_active?'공개':'비공개'}</small><div class="actions"><button data-toggle="${t.id}" data-active="${t.is_active}">${t.is_active?'비공개':'공개'}</button><button class="secondary" data-delete="${t.id}">삭제</button></div></div></article>`).join(''):'<div class="empty">등록된 템플릿이 없습니다. 새 템플릿을 제작해 주세요.</div>';document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=async()=>{await request('/api/admin/templates/'+b.dataset.toggle,{method:'PATCH',body:JSON.stringify({is_active:b.dataset.active!=='true'})});load()});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(!confirm('이 템플릿을 삭제할까요?'))return;await request('/api/admin/templates/'+b.dataset.delete,{method:'DELETE'});load()})}catch(error){document.querySelector('#message').textContent=error.message}}load();
  </script>
  <script type="module" src="/js/template-studio.js"></script>
  <script src="/js/admin-nav.js"></script>
</body></html>
