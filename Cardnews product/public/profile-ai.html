<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>POLLINSIGHT | AI 디자인 제안</title><style>
:root{--blue:#2563eb;--ink:#172033;--muted:#64748b;--line:#dbe3ee}*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:var(--ink);font-family:Pretendard,system-ui,sans-serif}.top{height:64px;display:flex;align-items:center;gap:13px;padding:0 30px;background:#fff;border-bottom:1px solid var(--line)}.mark{padding:8px 10px;border-radius:9px;background:var(--blue);color:#fff;font-weight:900}.spacer{flex:1}a{text-decoration:none;color:#526075;font-size:14px}.shell{max-width:1120px;margin:auto;padding:38px 24px}.intro h1{margin:0;font-size:29px}.intro p{color:var(--muted);line-height:1.65}.prompt{display:flex;gap:9px;margin:20px 0}.prompt input{flex:1;border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit}.button{border:0;border-radius:10px;padding:12px 14px;background:var(--blue);color:#fff;font-weight:800;cursor:pointer}.status{min-height:21px;color:#2563eb;font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:16px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}.preview{height:245px;padding:22px;color:#fff;background:linear-gradient(145deg,#14532d,#0f1f16)}.preview.campaign{background:linear-gradient(145deg,#1f53ad,#111827)}.preview.creator{background:linear-gradient(145deg,#6724b6,#171227)}.eyebrow{font-size:11px;letter-spacing:.08em;opacity:.8}.preview h2{font-size:27px;margin:58px 0 8px}.preview p{opacity:.85}.content{padding:17px}.content h3{margin:0 0 8px}.content p{min-height:50px;color:var(--muted);font-size:14px;line-height:1.55}.tags{display:flex;flex-wrap:wrap;gap:5px;margin:12px 0}.tag{font-size:11px;padding:5px 7px;border-radius:999px;background:#eef3fb;color:#40526d}.empty{border:1px dashed #b8c8de;border-radius:14px;padding:54px;text-align:center;color:var(--muted)}@media(max-width:760px){.top{padding:0 15px}.shell{padding:25px 15px}.grid{grid-template-columns:1fr}.prompt{display:block}.prompt .button{width:100%;margin-top:8px}}
</style></head><body><header class="top"><span class="mark">PI</span><strong>AI 디자인 제안</strong><span class="spacer"></span><a id="back" href="/profiles.html">명함 편집으로 돌아가기</a></header><main class="shell"><section class="intro"><h1>AI가 3가지 구성안을 제안합니다</h1><p>저장된 이름·직책·소개·링크 정보를 바탕으로 목적이 다른 디자인 구조를 만듭니다. 제안안을 적용한 뒤에도 모든 내용과 페이지를 자유롭게 수정할 수 있습니다.</p></section><div class="prompt"><input id="prompt" placeholder="예: 젊고 친근한 느낌, 공약을 더 강조해 주세요"><button class="button" id="generate">AI 디자인 제안 받기</button></div><p class="status" id="status"></p><section id="proposals" class="grid"><div class="empty">버튼을 눌러 디자인 제안을 생성하세요.</div></section></main><script>
const $=id=>document.getElementById(id);const api=async(path,opt={})=>{const r=await fetch(path,{credentials:'include',headers:{'Content-Type':'application/json'},...opt});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||'요청을 처리하지 못했습니다.');return d};const state={id:null,profile:null,proposals:[]};
function render(){const host=$('proposals');host.innerHTML=state.proposals.map(p=>`<article class="card"><div class="preview ${p.templateKey}"><span class="eyebrow">${p.name}</span><h2>${p.pages[0].heading||'나의 이야기'}</h2><p>${p.pages.map(x=>x.title).join(' · ')}</p></div><div class="content"><h3>${p.name}</h3><p>${p.description}</p><div class="tags">${p.pages.map(x=>`<span class="tag">${x.title}</span>`).join('')}</div><button class="button" data-apply="${p.id}">이 디자인 적용</button></div></article>`).join('');document.querySelectorAll('[data-apply]').forEach(button=>button.onclick=()=>apply(button.dataset.apply))}
async function generate(){try{$('status').textContent='제안안을 만들고 있습니다…';const d=await api('/api/profiles/'+state.id+'/design-proposals',{method:'POST',body:JSON.stringify({prompt:$('prompt').value})});state.proposals=d.proposals;$('status').textContent=d.source==='ai'?'AI가 제안한 3가지 디자인입니다.':'입력 정보를 바탕으로 만든 3가지 디자인 방향입니다.';render()}catch(e){$('status').textContent=e.message}}
async function apply(id){try{const selected=state.proposals.find(p=>p.id===id);if(!selected)return;$('status').textContent='선택한 디자인을 적용 중입니다…';const profileData={...(state.profile.profile_data||{}),pages:selected.pages};await api('/api/profiles/'+state.id,{method:'PATCH',body:JSON.stringify({title:state.profile.title,slug:state.profile.slug,template_key:selected.templateKey,is_published:state.profile.is_published,profile_data:profileData})});location.href='/profile-studio.html?id='+encodeURIComponent(state.id)}catch(e){$('status').textContent=e.message}}
async function load(){try{const id=new URLSearchParams(location.search).get('id');if(!id)throw Error('명함을 먼저 선택해 주세요.');const d=await api('/api/profiles/'+id);state.id=id;state.profile=d.profile;$('back').href='/profile-studio.html?id='+encodeURIComponent(id)}catch(e){$('status').textContent=e.message}}$('generate').onclick=generate;load();
</script></body></html>
