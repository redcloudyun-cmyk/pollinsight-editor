<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>캠페인 에디터 - 로그인</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            /* 화면 전체 높이 */
            background-color: #f4f7f6;
            /* 부드러운 배경색 */
            font-family: 'Pretendard', sans-serif;
            margin: 0;
        }

        .login-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 300px;
            text-align: center;
        }

        .login-container h2 {
            margin-bottom: 25px;
            color: #333;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            color: #666;
            margin-bottom: 5px;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
            /* 패딩 포함 크기 계산 */
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
            font-weight: bold;
        }

        button:hover {
            background-color: #555;
        }
    </style>
</head>

<body>

    <div class="login-container">
        <h2>로그인</h2>
        <div class="input-group">
            <label>아이디</label>
            <input type="text" id="username" placeholder="아이디를 입력하세요">
        </div>
        <div class="input-group">
            <label>비밀번호</label>
            <input type="password" id="password" placeholder="비밀번호를 입력하세요">
        </div>
        <!-- 클릭 시 아래의 JS 함수(handleLogin)를 실행 -->
        <button onclick="handleLogin()">로그인</button>
    </div>

    <script>
        async function handleLogin() {
            const usernameVal = document.getElementById('username').value;
            const passwordVal = document.getElementById('password').value;

            try {
                // 우리가 방금 만든 백엔드 API로 정보 전송!
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: usernameVal, password: passwordVal })
                });

                const data = await response.json();

                if (response.ok) {
                    // 로그인 성공 시!
                    alert(data.message);
                    // 🌟 [추가할 코드] 에디터로 넘어가기 전에 브라우저 메모리에 유저 ID(명찰)를 저장합니다.
                    localStorage.setItem('userId', data.userId);
                    // 에디터 메인 화면으로 이동시키는 마법의 코드 🪄
                    window.location.href = '/index.html';
                } else {
                    // 로그인 실패 시 (비밀번호 오류 등)
                    alert(data.message);
                }
            } catch (error) {
                console.error('로그인 요청 에러:', error);
                alert('서버와 통신 중 문제가 발생했습니다.');
            }
        }
    </script>

</body>

</html>
